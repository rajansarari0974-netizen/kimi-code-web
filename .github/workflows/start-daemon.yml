name: start-daemon
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
    steps:
      - name: Start kimi daemon on codespace
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          set -euo pipefail
          echo "== state check =="
          state=$(gh api "user/codespaces/$CS" --jq .state || echo unknown)
          echo "state=$state"
          if [ "$state" != "Available" ]; then
            echo "== starting codespace =="
            gh api -X POST "user/codespaces/$CS/start" >/dev/null || true
            for i in $(seq 1 24); do
              sleep 10
              state=$(gh api "user/codespaces/$CS" --jq .state)
              echo "poll state=$state"
              [ "$state" = "Available" ] && break
            done
            [ "$state" = "Available" ] || { echo "codespace not Available"; exit 1; }
          fi
          echo "== ssh: clean stale procs and start start-loop.sh =="
          printf 'y\n' | timeout 300 gh codespace ssh -c "$CS" -- '
            set -euo pipefail
            echo "== before =="
            pgrep -af "[s]tart-loop.sh" || echo "no start-loop"
            pgrep -af "[k]imi-code" || echo "no kimi"
            pkill -f "[s]tart-loop.sh" 2>/dev/null || true
            pkill -x kimi-code 2>/dev/null || true
            pkill -f "[c]loudflared tunnel" 2>/dev/null || true
            sleep 2
            cd /workspaces/kimi-code-web || { echo "REPO MISSING"; exit 1; }
            ls -la node_modules/.bin/kimi 2>/dev/null || echo "KIMI BIN MISSING"
            rm -f /tmp/start-loop.log /tmp/kimi-10002.log /tmp/start-loop.out
            setsid nohup bash start-loop.sh >/tmp/start-loop.out 2>&1 < /dev/null &
            echo "launched start-loop pid $!"
            for i in $(seq 1 12); do
              sleep 10
              if pgrep -x kimi-code >/dev/null; then
                echo "kimi-code UP after $((i*10))s"
                break
              fi
              echo "wait $((i*10))s: kimi not up yet"
            done
            echo "== procs after =="
            pgrep -af "[k]imi-code" || echo "NO KIMI"
            pgrep -af "[s]tart-loop.sh" || echo "no start-loop"
            pgrep -af "[c]loudflared tunnel" | head -2 || echo "no tunnel"
            echo "== listener =="
            ss -tlnp 2>/dev/null | grep 10002 || echo "no listener 10002"
            echo "== logs =="
            tail -20 /tmp/start-loop.out 2>&1 || true
            tail -20 /tmp/start-loop.log 2>&1 || true
            tail -30 /tmp/kimi-10002.log 2>&1 || true
            exit 0
          '
          echo "== url check =="
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" "https://$CS-10002.app.github.dev/" || echo ERR)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "URL OK"
              break
            fi
            sleep 10
          done
