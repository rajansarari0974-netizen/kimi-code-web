name: codespace-fix
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'diag or fix or prov or fixprov or fixzen'
        required: true
        default: 'diag'
        type: choice
        options:
          - diag
          - fix
          - prov
          - fixprov
          - fixzen
          - testdeep
          - fixdef
          - fixoz
          - fixoz2
          - fixinf
permissions:
  contents: read
jobs:
  runfix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
    steps:
      - name: Diagnose
        if: inputs.action == 'diag'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 120 gh codespace ssh -c "$CS" -- 'echo "== ps kimi/node/loop =="; ps aux | grep -iE "kimi|node|start-loop" | grep -v grep; echo "== daemon pgrep =="; pgrep -af -x kimi-code; echo "== sessions newest =="; ls -lt /home/node/.kimi-code/sessions/ 2>/dev/null | head -15; echo "== start-loop.log =="; tail -30 /tmp/start-loop.log 2>/dev/null; echo "== diag done =="'
      - name: Fix - restart daemon
        if: inputs.action == 'fix'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 150 gh codespace ssh -c "$CS" -- 'echo "== before =="; pgrep -af -x kimi-code; pkill -9 -f "^bash -c pgrep -x kimi-code" 2>/dev/null; pkill -9 -x kimi-code 2>/dev/null; pkill -9 -f "^bash start-loop" 2>/dev/null; sleep 3; cd /workspaces/kimi-code-web && nohup bash start-loop.sh >/tmp/start-loop.log 2>&1 < /dev/null & sleep 10; echo "== after =="; pgrep -af -x kimi-code; echo "== log tail =="; tail -5 /tmp/start-loop.log; echo "== fix done =="'
      - name: Prov - dump config + test zen key
        if: inputs.action == 'prov'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 150 gh codespace ssh -c "$CS" -- '
            echo "== whoami/home =="; whoami; echo "$HOME"
            for d in /home/node/.kimi-code /root/.kimi-code "$HOME/.kimi-code"; do echo "== $d =="; ls -la "$d" 2>/dev/null | head -20; done
            CFG=""
            for c in /home/node/.kimi-code/config.toml /root/.kimi-code/config.toml "$HOME/.kimi-code/config.toml"; do [ -f "$c" ] && CFG="$c" && break; done
            echo "== CFG=$CFG =="
            [ -n "$CFG" ] || exit 0
            echo "== config masked =="
            sed -E "s/(api[_-]?key[[:space:]]*=[[:space:]]*\"?)[^\" ]{6,}/\1MASKED/g; s/(server_password[[:space:]]*=[[:space:]]*\"?)[^\" ]{6,}/\1MASKED/g; s/(sk-[A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/\1MASKED/g" "$CFG" | grep -E "provider|base_url|api_key|model|\[providers|\[models" | head -80
            echo "== zen key live test =="
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/")
            echo "key_len=${#KEY}"
            if [ -n "$KEY" ] && [ "$KEY" != "MASKED" ]; then
              curl -s -o /dev/null -w "models_http=%{http_code}\n" --max-time 20 https://opencode.ai/zen/v1/models -H "Authorization: Bearer $KEY"
              curl -s --max-time 20 https://opencode.ai/zen/v1/models -H "Authorization: Bearer $KEY" | head -c 200; echo
            else
              echo "no zen key in config"
            fi
            echo "== prov done =="
          '
      - name: Fixprov - list zen models + live test each
        if: inputs.action == 'fixprov'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 240 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            echo "== default_model =="
            grep -E "^default_model" "$CFG"
            echo "== zen model entries =="
            awk "/^\[models\.opencode-zen/{flag=1} /^\[models\./ && !/^\[models\.opencode-zen/{flag=0} flag" "$CFG"
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/")
            echo "key_len=${#KEY}"
            echo "== live chat tests =="
            awk "/^\[models\.opencode-zen/{flag=1} /^\[models\./ && !/^\[models\.opencode-zen/{flag=0} flag" "$CFG" | grep -E "^model\s*=" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/" | while read -r MID; do
              [ -n "$MID" ] || continue
              RESP=$(curl -s --max-time 30 https://opencode.ai/zen/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"$MID\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}")
              if echo "$RESP" | grep -q '"error"'; then
                MSG=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"error\",{}).get(\"message\",\"unknown\"))" 2>/dev/null)
                echo "FAIL [$MID] => $MSG"
              else
                echo "OK   [$MID]"
              fi
            done
            echo "== fixprov done =="
          '
      - name: Fixzen - fix invalid zen model ids + restart + verify
        if: inputs.action == 'fixzen'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 240 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            cp "$CFG" "$CFG.bak.$(date +%s)"
            echo "== before =="
            grep -nE "model\s*=\s*\"(qwen3\.6-plus-free|minimax-m3-free)\"" "$CFG"
            sed -i -E "s/^(model\s*=\s*\")qwen3\.6-plus-free(\")/\1qwen3.6-plus\2/; s/^(model\s*=\s*\")minimax-m3-free(\")/\1minimax-m3\2/" "$CFG"
            echo "== after =="
            grep -nE "model\s*=\s*\"(qwen3\.6|minimax-m3)" "$CFG"
            echo "== restarting daemon =="
            pkill -9 -x kimi-code 2>/dev/null
            pkill -9 -f "^bash start-loop" 2>/dev/null
            sleep 3
            cd /workspaces/kimi-code-web && nohup bash start-loop.sh >/tmp/start-loop.log 2>&1 < /dev/null &
            sleep 12
            echo "== daemon =="
            pgrep -af -x kimi-code
            echo "== url check =="
            curl -s -o /dev/null -w "ui_http=%{http_code}\n" --max-time 20 https://supreme-space-orbit-4qgppx6xq7r7cjwxw-10002.app.github.dev/
            echo "== default model live =="
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/")
            RESP=$(curl -s --max-time 30 https://opencode.ai/zen/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"nemotron-3-ultra-free\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":10}")
            echo "$RESP" | head -c 300; echo
            echo "== log tail =="
            tail -5 /tmp/start-loop.log
            echo "== fixzen done =="
          '
      - name: Testdeep - single deepseek free live test
        if: inputs.action == 'testdeep'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 150 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"/\1/")
            echo "key_len=${#KEY}"
            for MID in deepseek-v4-flash-free nemotron-3-ultra-free; do
              RESP=$(curl -s -i --max-time 45 https://opencode.ai/zen/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"$MID\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}")
              echo "== $MID =="
              echo "$RESP" | grep -iE "^x-ratelimit|^retry-after|rate limit|payment method" | head -6
              echo "$RESP" | grep -aE "id|content|error" | tail -c 300
              echo
            done
            echo "== testdeep done =="
          '
      - name: Fixoz - dump zen model entries + live test candidates
        if: inputs.action == 'fixoz'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 300 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            echo "== default =="
            grep -n "^default_model" "$CFG"
            echo "== zen/deepseek model entry names =="
            grep -nE "^\[models\..*" "$CFG" | grep -iE "zen|deepseek|dv4|dsv4" | head -20
            echo "== entries body =="
            awk "/^\[models\./{flag=0} /^\[models\./ && /zen|deepseek|dv4|dsv4/{flag=1} flag" "$CFG" | grep -vE "api_key|api-key" | head -50
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/")
            echo "key_len=${#KEY}"
            echo "== live tests =="
            for MID in deepseek-v4-flash-free deepseek-v4-flash deepseek-v4-pro mimo-v2.5-free nemotron-3.5-lightning-free ling-3.0-flash-free; do
              RESP=$(curl -s --max-time 30 https://opencode.ai/zen/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"$MID\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}")
              if echo "$RESP" | grep -q "\"error\""; then
                MSG=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get(\"error\",{}).get(\"message\",\"?\"))" 2>/dev/null | head -c 160)
                echo "FAIL [$MID] => $MSG"
              else
                echo "OK   [$MID]"
              fi
            done
            echo "== session dir =="
            ls -lt /home/node/.kimi-code/sessions/wd_root_94a6b4475803/session_d5c45a7f-7060-4739-a5cd-be8eb53d5955/ 2>/dev/null | head -8
            grep -raE "deepseek-v4|opencode-zen" /home/node/.kimi-code/sessions/wd_root_94a6b4475803/session_d5c45a7f-7060-4739-a5cd-be8eb53d5955/ 2>/dev/null | grep -v "wire.jsonl" | head -6
            echo "== fixoz done =="
          '
      - name: Fixdef - set default model to nemotron free
        if: inputs.action == 'fixdef'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 150 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            cp "$CFG" "$CFG.bak.$(date +%s)"
            echo "== before =="
            grep -n "^default_model" "$CFG"
            sed -i -E "s/^default_model\s*=.*/default_model = \"opencode-zen-nemotron\"/" "$CFG"
            echo "== after =="
            grep -n "^default_model" "$CFG"
            echo "== restarting daemon =="
            pkill -9 -x kimi-code 2>/dev/null
            pkill -9 -f "^bash start-loop" 2>/dev/null
            sleep 3
            cd /workspaces/kimi-code-web && nohup bash start-loop.sh >/tmp/start-loop.log 2>&1 < /dev/null &
            sleep 12
            echo "== daemon =="
            pgrep -af -x kimi-code
            echo "== url check =="
            curl -s -o /dev/null -w "ui_http=%{http_code}\n" --max-time 20 https://supreme-space-orbit-4qgppx6xq7r7cjwxw-10002.app.github.dev/
            echo "== log tail =="
            tail -5 /tmp/start-loop.log
            echo "== fixdef done =="
          '
      - name: Fixoz2 - wire working zen model into entries + restart + verify
        if: inputs.action == 'fixoz2'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 240 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            cp "$CFG" "$CFG.bak.$(date +%s)"
            echo "== before =="
            grep -nE "^default_model|model\s*=\s*\"(deepseek-v4-flash-free|mimo-v2.5-free)\"" "$CFG"
            sed -i "s/^model = \"deepseek-v4-flash-free\"/model = \"nemotron-3.5-lightning-free\"/" "$CFG"
            sed -i "s/^model = \"mimo-v2.5-free\"/model = \"nemotron-3.5-lightning-free\"/" "$CFG"
            sed -i "s/^default_model = .*/default_model = \"opencode-zen-deepseek-v4\"/" "$CFG"
            echo "== after =="
            grep -nE "^default_model|model\s*=\s*\"nemotron-3.5-lightning-free\"" "$CFG"
            echo "== restarting daemon =="
            pkill -9 -x kimi-code 2>/dev/null
            pkill -9 -f "^bash start-loop" 2>/dev/null
            sleep 3
            cd /workspaces/kimi-code-web && nohup bash start-loop.sh >/tmp/start-loop.log 2>&1 < /dev/null &
            sleep 12
            echo "== daemon =="
            pgrep -af -x kimi-code
            echo "== url check =="
            curl -s -o /dev/null -w "ui_http=%{http_code}\n" --max-time 20 https://supreme-space-orbit-4qgppx6xq7r7cjwxw-10002.app.github.dev/
            echo "== wired default live test =="
            KEY=$(sed -n "/\[providers\..*opencode-zen/,/^\[/p" "$CFG" | grep -m1 -E "api[_-]?key" | sed -E "s/.*=\s*\"?([^\"]+)\"?/\1/")
            RESP=$(curl -s --max-time 30 https://opencode.ai/zen/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"nemotron-3.5-lightning-free\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":10}")
            echo "$RESP" | head -c 400; echo
            echo "== find user session =="
            find /home/node/.kimi-code/sessions -maxdepth 3 -name "session_d5c45a7f*" -type d 2>/dev/null | head -3
            for sd in $(find /home/node/.kimi-code/sessions -maxdepth 3 -name "session_d5c45a7f*" -type d 2>/dev/null); do
              echo "== $sd =="
              grep -raE "deepseek-v4|opencode-zen|mimo-v2" "$sd" 2>/dev/null | grep -v wire.jsonl | head -5
            done
            echo "== log tail =="
            tail -5 /tmp/start-loop.log
            echo "== fixoz2 done =="
          '
      - name: Fixinf - add inferx provider + models + restart + verify
        if: inputs.action == 'fixinf'
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          printf 'y\n' | timeout 300 gh codespace ssh -c "$CS" -- '
            CFG=/home/node/.kimi-code/config.toml
            [ -f "$CFG" ] || { echo "no config"; exit 0; }
            cp "$CFG" "$CFG.bak.$(date +%s)"
            echo "== before: inferx present? =="
            grep -nE "^\[providers\.inferx\]|^\[models\.inferx" "$CFG" || echo "none"
            if ! grep -q "^\[providers\.inferx\]" "$CFG"; then
              cat >> "$CFG" <<EOF

[providers.inferx]
base_url = "https://model.inferx.net/endpoints/v1"
api_key = "ix_d5f1bea49d716de848a7e84a5ed8791efa34f2f67048ae4d2e74025f166dd0f6"
EOF
              echo "provider added"
            else
              echo "provider already exists"
            fi
            for pair in "inferx-deepseek-v4-flash:deepseek-v4-flash" "inferx-deepseek-v4-flash-0731:deepseek-v4-flash-0731" "inferx-Agents-A1:Agents-A1" "inferx-Devstral-2-123B-Instruct-2512-int4-AutoRound:Devstral-2-123B-Instruct-2512-int4-AutoRound" "inferx-Ornith-1.0-35B-FP8:Ornith-1.0-35B-FP8" "inferx-Qwen3-Coder-Next-FP8:Qwen3-Coder-Next-FP8" "inferx-Qwen3.6-35B-A3B-FP8:Qwen3.6-35B-A3B-FP8" "inferx-Qwen3.6-35B-A3B-fp8-no-thinking:Qwen3.6-35B-A3B-fp8-no-thinking"; do
              NAME="${pair%%:*}"
              MID="${pair##*:}"
              if ! grep -q "^\[models\.$NAME\]" "$CFG"; then
                printf "\n[models.%s]\nprovider = \"inferx\"\nmodel = \"%s\"\n" "$NAME" "$MID" >> "$CFG"
                echo "added model $NAME -> $MID"
              else
                echo "exists model $NAME"
              fi
            done
            echo "== after: provider section =="
            awk "/^\[providers\.inferx\]/{f=1} /^\[providers\./ && !/^\[providers\.inferx\]/{f=0} f" "$CFG"
            echo "== after: model entries =="
            awk "/^\[models\.inferx/{f=1} /^\[models\./ && !/^\[models\.inferx/{f=0} f" "$CFG" | grep -E "^\[|^provider|^model" | head -40
            echo "== restarting daemon =="
            pkill -9 -x kimi-code 2>/dev/null
            pkill -9 -f "^bash start-loop" 2>/dev/null
            sleep 3
            cd /workspaces/kimi-code-web && nohup bash start-loop.sh >/tmp/start-loop.log 2>&1 < /dev/null &
            sleep 12
            echo "== daemon =="
            pgrep -af -x kimi-code
            echo "== url check =="
            curl -s -o /dev/null -w "ui_http=%{http_code}\n" --max-time 20 https://supreme-space-orbit-4qgppx6xq7r7cjwxw-10002.app.github.dev/
            echo "== inferx live test =="
            KEY="ix_d5f1bea49d716de848a7e84a5ed8791efa34f2f67048ae4d2e74025f166dd0f6"
            RESP=$(curl -s --max-time 45 https://model.inferx.net/endpoints/v1/chat/completions -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "{\"model\":\"deepseek-v4-flash-0731\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":10}")
            echo "$RESP" | head -c 500; echo
            echo "== log tail =="
            tail -5 /tmp/start-loop.log
            echo "== fixinf done =="
          '
# nudge re-index
