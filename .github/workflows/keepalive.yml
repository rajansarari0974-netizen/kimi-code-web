name: codespace-keepalive

on:
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespace-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GH_CODESPACE_TOKEN }}
    steps:
      - name: Cadence wait (self-chain)
        run: sleep 600
      - name: Ping codespace and self-heal
        env:
          CS: supreme-space-orbit-4qgppx6xq7r7cjwxw
        run: |
          set -euo pipefail
          echo "== state check =="
          state=$(gh api "user/codespaces/$CS" --jq .state)
          echo "state=$state"
          if [ "$state" != "Available" ]; then
            echo "== starting codespace (state=$state) =="
            gh api -X POST "user/codespaces/$CS/start" >/dev/null || true
            for i in $(seq 1 18); do
              sleep 10
              state=$(gh api "user/codespaces/$CS" --jq .state)
              echo "poll state=$state"
              [ "$state" = "Available" ] && break
            done
            if [ "$state" != "Available" ]; then
              echo "codespace failed to become Available, state=$state"
              exit 1
            fi
          fi
          echo "== ssh ping + kimi watchdog =="
          printf 'y\n' | timeout 120 gh codespace ssh -c "$CS" -- 'pgrep -x kimi-code >/dev/null || (cd /workspaces/kimi-code-web && setsid nohup bash start-loop.sh >>/tmp/start-loop.out 2>&1 </dev/null &); echo keepalive-$(date +%H:%M)'
          echo "== url check =="
          code=$(curl -s --max-time 20 -o /dev/null -w "%{http_code}" -L "https://$CS-10002.app.github.dev/sessions" || echo ERR)
          echo "sessions HTTP $code"
          if [ "$code" != "200" ]; then
            echo "URL not healthy"
            exit 1
          fi
          echo "KEEPALIVE OK"
      - name: Self-chain dispatch (never let it die)
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          gh workflow run keepalive.yml --ref master -R rajansarari0974-netizen/kimi-code-web
