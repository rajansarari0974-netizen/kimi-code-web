name: keepalive
on:
  schedule:
    - cron: '3/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Kimi Code
        run: curl -sI -m 10 -o /dev/null -w "%{http_code}\n" https://kimi-code-6we8.onrender.com/
      - name: Ping Kimi Claw health
        run: curl -sI -m 10 -o /dev/null -w "%{http_code}\n" https://kimi-code-6we8.onrender.com/claw/health
