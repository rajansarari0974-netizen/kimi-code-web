default_model = "bluesminds-gpt52-chat"

[env]
UV_USE_IO_URING = "0"
LIBUV_NO_IO_URING = "1"
server_password = "__ENV_SERVER_PASSWORD__"

[providers.opencode-zen]
type = "openai"
api_key = "__ENV_OPENCODE_ZEN_API_KEY__"
base_url = "https://opencode.ai/zen/v1"

[providers.bluesminds]
type = "openai"
api_key = "__ENV_BLUESMINDS_API_KEY__"
base_url = "https://api.bluesminds.com/v1"
stream = true
max_retries = 1

[providers.bluesminds-backup]
type = "openai"
api_key = "__ENV_BLUESMINDS_API_KEY__"
base_url = "https://api.bluesminds.com/v1"

[providers.omniroute]
type = "openai"
api_key = "no-auth-required"
base_url = "http://127.0.0.1:20128/v1"

[providers.z-ai]
type = "openai"
api_key = "__ENV_Z_AI_API_KEY__"
base_url = "https://open.bigmodel.cn/api/paas/v4/"

[providers.zenmux]
type = "openai"
api_key = "__ENV_ZENMUX_API_KEY__"
base_url = "https://zenmux.ai/api/v1"

[providers.cloudflare]
type = "openai"
api_key = "__ENV_CLOUDFLARE_API_KEY__"
base_url = "https://api.cloudflare.com/client/v4/accounts/5f649ab31f3eea8092b74d83a9706895/ai/v2"

[providers.nvidia]
type = "openai"
api_key = "__ENV_NVIDIA_API_KEY__"
base_url = "https://integrate.api.nvidia.com/v1"

[providers.nvidia-moonshotai]
type = "openai"
api_key = "__ENV_NVIDIA_API_KEY__"
